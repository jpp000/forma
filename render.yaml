# Render Blueprint — Forma
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forma-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: forma-db
          property: connectionString

databases:
  - name: forma-db
    plan: free
    region: ohio
    databaseName: forma
    postgresMajorVersion: "16"
