x-app-volumes: &app-volumes
  - .:/app
  - dev_node_modules:/app/node_modules
  - dev_api_node_modules:/app/apps/api/node_modules
  - dev_web_portal_node_modules:/app/apps/web-portal/node_modules
  - dev_worker_node_modules:/app/apps/worker/node_modules
  - dev_types_node_modules:/app/packages/types/node_modules
  - dev_config_node_modules:/app/packages/config/node_modules

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma
      POSTGRES_DB: forma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      CI: "true"
      DATABASE_URL: postgresql://forma:forma@postgres:5432/forma
      PORT: "3000"
      NODE_ENV: development
      EMAIL_PROVIDER: mock
      JWT_SECRET: dev-secret-change-in-production
      OAUTH_MOCK: "true"
      OAUTH_MOBILE_SUCCESS_URL: forma://oauth
      OAUTH_WEB_SUCCESS_URL: http://localhost:5173/oauth/callback
      CORS_ORIGIN: http://localhost:5173,http://localhost:19006
      # Do not set GOOGLE_CLIENT_ID here — mock OAuth must stay enabled for local login.
      RUN_MIGRATIONS: "true"
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s
    command: ["pnpm", "--filter", "@forma/api", "dev"]

  web-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_OAUTH_SUCCESS_URL: http://localhost:5173/oauth/callback
      CHOKIDAR_USEPOLLING: "true"
    volumes: *app-volumes
    depends_on:
      api:
        condition: service_healthy
    command: ["pnpm", "--filter", "@forma/web-portal", "dev"]

volumes:
  postgres_data:
  dev_node_modules:
  dev_api_node_modules:
  dev_web_portal_node_modules:
  dev_worker_node_modules:
  dev_types_node_modules:
  dev_config_node_modules:
